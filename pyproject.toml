[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tumortrust-vlm"
version = "0.1.0"
description = "Trust-aware 3D brain-tumor segmentation, burden, and reporting research framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "nibabel>=5.1",
  "PyYAML>=6.0",
  "torch>=2.1",
  "monai>=1.3",
]

[project.optional-dependencies]
reporting = [
  "transformers>=4.36",
  "peft>=0.7",
  "accelerate>=0.20",
  "bert-score==0.3.13",
]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["tumortrust_vlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
